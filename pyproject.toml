[project]
name = "chitchat"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.142.2",
    "openai>=3.22.1",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-playwright>=0.9.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["live: hits the real OpenAI API (needs OPENAI_API_KEY)"]
addopts = "-m 'not live'"
