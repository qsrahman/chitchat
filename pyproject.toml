[project]
name = "chitchat"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.142.2",
    "filetype>=1.2.0",
    "openai>=3.22.1",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.19.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-playwright>=0.9.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["live: hits the real OpenAI API (needs OPENAI_API_KEY)"]
addopts = "-m 'not live' -n auto"  # tests run in parallel (pytest-xdist); `-n 0` to run in one process, e.g. to debug

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["app"]  # the application; the tests are not type-checked
pythonVersion = "3.14"
